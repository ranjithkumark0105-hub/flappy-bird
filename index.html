<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- Game Container with responsive aspect ratio -->
    <div id="game-container" class="game-container">
      <canvas id="game-canvas"></canvas>

      <!-- HUD: Score during gameplay -->
      <div id="hud" class="hud hidden">
        <div id="score-display" class="hud-score">0</div>
      </div>

      <!-- Start Screen Overlay -->
      <div id="start-screen" class="overlay">
        <div class="title-container">
          <h1 class="game-title">FLAPPY<br><span class="title-sub">BIRD</span></h1>
        </div>
        <div class="instruction-box">
          <div class="tap-icon">
            <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
          </div>
          <p class="instruction-text">Click, Tap, or Press <strong>SPACE</strong> to Flap</p>
        </div>
        <button id="start-btn" class="action-btn">START GAME</button>
      </div>

      <!-- Game Over Screen Overlay -->
      <div id="game-over-screen" class="overlay hidden">
        <div class="game-over-card">
          <h2 class="game-over-title">GAME OVER</h2>
          
          <div class="scoreboard">
            <div class="medal-slot">
              <span class="label">MEDAL</span>
              <div id="medal-icon" class="medal-icon">🥉</div>
            </div>
            <div class="score-details">
              <div class="score-row">
                <span class="label">SCORE</span>
                <span id="final-score" class="val">0</span>
              </div>
              <div class="score-row">
                <span class="label">BEST</span>
                <span id="best-score" class="val">0</span>
              </div>
            </div>
          </div>

          <div id="new-high-badge" class="new-high-badge hidden">NEW BEST! 🎉</div>

          <div class="button-group">
            <button id="restart-btn" class="action-btn">PLAY AGAIN</button>
          </div>
        </div>
      </div>

      <!-- Sound toggle button -->
      <button id="sound-btn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
        <svg id="sound-icon-on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>

      <!-- Controls helper badge at bottom -->
      <div class="controls-hint">Tap / Spacebar to Fly</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
